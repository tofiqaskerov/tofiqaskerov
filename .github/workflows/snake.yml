name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: tofiqaskerov
          outputs: |
            "dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23A020F0&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353"

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
